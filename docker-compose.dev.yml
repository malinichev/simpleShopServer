services:
  postgres:
    image: postgres:16
    container_name: sports-shop-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: sports-shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sports-shop-network

  redis:
    image: redis:alpine
    container_name: sports-shop-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - sports-shop-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: sports-shop-pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - sports-shop-network

  # Локальный S3. MinIO закрыл бесплатную раздачу (dl.min.io → 410,
  # docker minio/minio → pull только по авторизации), поэтому дев-стек
  # переведён на SeaweedFS (Apache-2.0, S3-совместимый, анонимный режим —
  # dev-креды S3_ACCESS_KEY/S3_SECRET_KEY подходят любые).
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: sports-shop-s3
    restart: unless-stopped
    ports:
      - '9000:8333'
      - '9333:9333'
    volumes:
      - s3_data:/data
    command: 'server -s3 -dir /data -master.port 9333 -volume.port 8080 -s3.port 8333'
    networks:
      - sports-shop-network

  createbuckets:
    image: chrislusf/seaweedfs:latest
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      sleep 8;
      echo 's3.bucket.create -name sports-shop' | weed shell -master s3:9333;
      exit 0;
      "
    networks:
      - sports-shop-network

volumes:
  postgres_data:
  redis_data:
  s3_data:
  pgadmin_data:

networks:
  sports-shop-network:
    driver: bridge
