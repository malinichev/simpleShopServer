# Nginx config — Server 2: Next.js Storefront reverse proxy
# Назначение: reverse proxy к localhost:3002, статический кэш

server {
    listen 443 ssl http2;
    server_name YOUR_CLIENT_DOMAIN;

    # SSL (пути подставь свои)
    ssl_certificate     /etc/ssl/certs/YOUR_CLIENT_DOMAIN.pem;
    ssl_certificate_key /etc/ssl/private/YOUR_CLIENT_DOMAIN.key;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ===== robots.txt — полностью запрещаем индексацию =====
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # Блокировка скрытых файлов
    location ~ /\. {
        deny all;
    }

    # Блокировка .env, backup-файлов
    location ~* \.(env|bak|backup|old|sql|tar|gz|zip)$ {
        deny all;
    }

    # Статические ассеты Next.js (/_next/static/)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache STATIC;
        proxy_cache_valid 200 1y;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Публичные файлы (из public/)
    location ~ ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
        # robots.txt уже перехвачен выше, это для остальных статичных файлов
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Основной proxy на Next.js
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # Буферизация
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Лимит тела запроса
        client_max_body_size 10m;
    }

    # Proxy cache path (определяется в http-блоке nginx.conf)
    # proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=365d max_size=1g;

    # Логи
    access_log /var/log/nginx/client.access.log;
    error_log  /var/log/nginx/client.error.log;
}
