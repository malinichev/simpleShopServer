# Nginx config — Server 1: NestJS API reverse proxy
# Назначение: reverse proxy к localhost:4000, rate limiting, security headers

# Rate limiting — auth endpoints
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

server {
    listen 443 ssl http2;
    server_name YOUR_API_DOMAIN;

    # SSL (пути подставь свои)
    ssl_certificate     /etc/ssl/certs/YOUR_API_DOMAIN.pem;
    ssl_certificate_key /etc/ssl/private/YOUR_API_DOMAIN.key;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ===== robots.txt — полностью запрещаем индексацию =====
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # Блокировка Swagger в production
    location /api/docs {
        return 404;
    }
    location /api/openapi.yaml {
        return 404;
    }

    # Блокировка скрытых файлов
    location ~ /\. {
        deny all;
    }

    # Блокировка .env, backup-файлов
    location ~* \.(env|bak|backup|old|sql|tar|gz|zip)$ {
        deny all;
    }

    # API proxy
    location / {
        # Rate limiting на auth-эндпоинты
        location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://127.0.0.1:4000;
        }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Буферизация
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Лимит тела запроса (upload)
        client_max_body_size 20m;
    }

    # Логи
    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;
}
