# Nginx config — Server 1: Admin Panel SPA static
# Назначение: раздача статики Vite build, SPA fallback, CSP

server {
    listen 443 ssl http2;
    server_name YOUR_ADMIN_DOMAIN;

    # SSL (пути подставь свои)
    ssl_certificate     /etc/ssl/certs/YOUR_ADMIN_DOMAIN.pem;
    ssl_certificate_key /etc/ssl/private/YOUR_ADMIN_DOMAIN.key;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP для SPA
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none';" always;

    root /var/www/simple-shop-admin/current/dist;
    index index.html;

    # ===== robots.txt — полностью запрещаем индексацию админки =====
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # Блокировка скрытых файлов
    location ~ /\. {
        deny all;
    }

    # Блокировка .env, backup-файлов
    location ~* \.(env|bak|backup|old|sql|tar|gz|zip)$ {
        deny all;
    }

    # Статика с долгим кэшем (Vite хэширует ассеты)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Логи
    access_log /var/log/nginx/admin.access.log;
    error_log  /var/log/nginx/admin.error.log;
}
